worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
}

http {
    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$request_uri","status":$status,"upstream":"$upstream_addr",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"cache":"$upstream_http_x_cache","instance":"$upstream_http_x_instance"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;
    server_tokens off;

    upstream gateway_pool {
        # Docker's embedded DNS returns one A record per gateway replica, and Nginx
        # expands them into separate upstream servers when it loads this config — so
        # this round-robins across every replica that was running at load time.
        # A scale change therefore needs `nginx -s reload`, which re-resolves the name
        # without dropping connections; scripts/scaling.sh does this automatically.
        server gateway:3000 max_fails=3 fail_timeout=10s;

        # Connection reuse is not optional here. Without a keepalive pool Nginx opens a
        # fresh TCP connection for every proxied request; at a few thousand requests per
        # second the container runs out of ephemeral ports and requests fail with
        # "connect() failed (99: Address not available)" long before the gateway itself
        # is under any strain. Measured: this was the entire cause of a 44% error rate
        # in the first scaling run.
        keepalive 256;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","component":"nginx"}';
        }

        location / {
            proxy_pass http://gateway_pool;

            # Both are required for upstream keepalive to take effect: HTTP/1.1 and an
            # empty Connection header, so the request does not ask to close the socket.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # The gateway rate limits per client, so it needs the real client address
            # rather than Nginx's.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            # Comfortably above the gateway's own upstream timeout, so a slow upstream
            # surfaces as the gateway's typed 504 rather than an opaque Nginx one.
            proxy_read_timeout 20s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
